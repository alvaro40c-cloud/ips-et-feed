name: ET feed -> et-megatron.rsc

on:
  schedule:
    # todos los dias a las 03:17 UTC (23:17 en Bolivia)
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_et_rsc.py"
      - "tests/**"
      - ".github/workflows/et-feed.yml"

permissions:
  contents: write

concurrency:
  group: et-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de test
        run: python -m pip install --quiet pytest

      - name: Tests
        run: python -m pytest tests -q

      - name: Compilar el .rsc
        run: python build_et_rsc.py

      - name: Validar el artefacto
        run: |
          set -eu
          test -s et-megatron.rsc
          test -s et-megatron.json
          grep -q "realizado por megatron" et-megatron.rsc
          grep -q "^# entradas: " et-megatron.rsc
          grep -q "^:global ipsEtCount " et-megatron.rsc
          if head -c 3 et-megatron.rsc | od -An -tx1 | tr -d ' \n' | grep -qi '^efbbbf'; then
            echo "ERROR: el .rsc tiene BOM, RouterOS fallaria al importar"
            exit 1
          fi
          size=$(wc -c < et-megatron.rsc)
          echo "Tamano: ${size} bytes"
          test "$size" -lt 200000
          {
            echo "### Feed ET compilado"
            echo
            cat et-megatron.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit si cambio
        run: |
          set -eu
          git config user.name "ips-megatron"
          git config user.email "ips-megatron@users.noreply.github.com"
          git add et-megatron.rsc et-megatron.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el feed."
            exit 0
          fi
          count=$(grep -m1 "^# entradas: " et-megatron.rsc | awk '{print $3}')
          git commit -m "ET compromised: ${count} redes ($(date -u +%Y-%m-%d)) - realizado por megatron"
          git push
